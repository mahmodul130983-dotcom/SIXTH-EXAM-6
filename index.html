<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK SIXTH EXAM</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .quiz-card { background: var(--card-bg); width: 100%; max-width: 650px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); padding: 32px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border-color); }
    .progress-text { font-size: 14px; font-weight: 600; color: var(--primary-color); background: rgba(79, 70, 229, 0.1); padding: 6px 14px; border-radius: 20px; }
    .progress-bar-container { width: 100%; height: 8px; background-color: var(--border-color); border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
    .progress-bar { height: 100%; background-color: var(--primary-color); width: 0%; transition: width 0.3s ease; }
    .question-title { font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 20px; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { width: 100%; padding: 14px 18px; font-size: 16px; text-align: left; background: transparent; color: var(--text-main); border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary-color); background-color: rgba(79, 70, 229, 0.05); }
    .option-btn.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: var(--correct-text) !important; font-weight: 600; }
    .option-btn.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: var(--wrong-text) !important; font-weight: 600; }
    .footer-actions { margin-top: 28px; display: flex; justify-content: flex-end; }
    .next-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 28px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; display: none; }
    
    .result-screen { text-align: center; display: none; }
    
    /* সুন্দর নাম এন্ট্রি স্ক্রিন ডিজাইন */
    .user-info-screen {
      text-align: center;
      padding: 10px 5px;
    }

    .welcome-icon {
      font-size: 45px;
      margin-bottom: 10px;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    .user-info-screen h2 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .user-info-screen p {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 6px;
      margin-bottom: 25px;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .user-info-screen input {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      color: var(--text-main);
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .user-info-screen input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    .start-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.4);
      transition: all 0.3s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -4px rgba(79, 70, 229, 0.5);
    }

    .start-btn:active {
      transform: translateY(0);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .score-circle { width: 150px; height: 150px; border-radius: 50%; background: rgba(79, 70, 229, 0.1); color: var(--primary-color); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px auto; font-size: 36px; font-weight: 800; }
    .score-details { display: flex; justify-content: space-around; margin: 20px 0; background: #f8fafc; padding: 16px; border-radius: 10px; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <div class="quiz-card">
    
    <!-- ১. পরীক্ষার্থীর নাম দেওয়ার স্ক্রিন -->
    <div id="user-info-view" class="user-info-screen" style="display: block;">
      <div class="welcome-icon">📝</div>
      <h2>Welcome to GK SIXTH Exam!</h2>
      <p>Write your full name below</p>
      
      <div class="input-group">
        <!-- Enter চাপলে কাজ করার জন্য onkeypress ইভেন্ট যোগ করা হয়েছে -->
        <input type="text" id="user-name" placeholder="Write your name here..." autocomplete="off" onkeypress="handleEnter(event)">
      </div>
      
      <button class="start-btn" onclick="startQuiz()">Start Exam ➔</button>
    </div>

    <!-- ২. মূল কুইজ স্ক্রিন -->
    <div id="quiz-view" style="display: none;">
      <div class="top-bar">
        <h2 id="display-name" style="font-size: 16px;"></h2>
        <span class="progress-text" id="progress-text">Question 1/40</span>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-title" id="question-title">QUESTION LOADING...</div>

      <div class="options-grid" id="options-grid"></div>

      <div class="footer-actions">
        <button class="next-btn" id="next-btn" onclick="handleNextQuestion()">NEXT QUESTION ➔</button>
      </div>
    </div>

    <!-- ৩. রেজাল্ট স্ক্রিন -->
    <div class="result-screen" id="result-view">
      <h2>Exam finish!</h2>
      <p style="color: var(--text-muted)">tumar folafol joma hoise pakhi</p>
      
      <div class="score-circle">
        <div id="final-score">০.০০</div>
        <span style="font-size: 14px; color: var(--text-muted);">Total score / 40</span>
      </div>

      <div class="score-details">
        <div><strong style="color: var(--correct-border); font-size: 20px;" id="correct-count">০</strong><br><small>সঠিক (+1.00)</small></div>
        <div><strong style="color: var(--wrong-border); font-size: 20px;" id="wrong-count">০</strong><br><small>ভুল (-0.25)</small></div>
      </div>
    </div>

  </div>

  <script>
    // ⚙️ ফায়ারবেজ কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyCTgSqtcDRtvfbIECDFEv_2jAEgModArXc",
      authDomain: "gk-exam-2.firebaseapp.com",
      projectId: "gk-exam-2",
      storageBucket: "gk-exam-2.firebasestorage.app",
      messagingSenderId: "52008698353",
      appId: "1:52008698353:web:08a24e1451711ab72f0450",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ৪০টি প্রশ্ন এবং সঠিক উত্তরের ডাটাবেজ
    const questionsDatabase = [
      { question: "1. প্রাচীন বাংলার বিক্রমপুর কোন ঐতিহাসিক অঞ্চলের অন্তর্ভুক্ত ছিল?", options: ["বরেন্দ্র", "বঙ্গ", "রাঢ়", "সমতট"], correct: 1 },
      { question: "2. বাংলার ইতিহাসে 'মাৎস্যন্যায়' বলতে কী বোঝায়?", options: ["একটি প্রাচীন কৃষিব্যবস্থা", "রাজনৈতিক অরাজকতা ও শক্তিশালীর দুর্বলের ওপর আধিপত্য", "একটি বৌদ্ধ ধর্মীয় উৎসব", "একটি সামরিক করব্যবস্থা"], correct: 1 },
      { question: "3. প্রাচীন বাংলার কোন বন্দরটি রোমান সাম্রাজ্যের সঙ্গে বাণিজ্যিক যোগাযোগের জন্য পরিচিত ছিল?", options: ["তাম্রলিপ্ত", "সপ্তগ্রাম", "চট্টগ্রাম", "সোনারগাঁও"], correct: 0 },
      { question: "4. সেন রাজবংশের শাসনামলে বাংলায় কোন ধর্মীয় প্রবণতা বিশেষভাবে শক্তিশালী হয়?", options: ["শৈব ও বৈষ্ণব হিন্দুধর্ম", "জরথুস্ত্রবাদ", "শিন্তো ধর্ম", "প্রোটেস্ট্যান্ট খ্রিষ্টধর্ম"], correct: 0 },
      { question: "5. মুঘল প্রশাসনে 'মনসবদারি প্রথা' মূলত কী নিয়ন্ত্রণ করত?", options: ["জমির মালিকানা হস্তান্তর", "সামরিক ও বেসামরিক কর্মকর্তাদের পদমর্যাদা এবং দায়িত্ব", "ধর্মীয় প্রতিষ্ঠানের নির্বাচন", "সমুদ্রবাণিজ্যের শুল্ক"], correct: 1 },
      { question: "6. ১৭৬৫ সালে ইস্ট ইন্ডিয়া কোম্পানি বাংলার দেওয়ানি লাভ করে কার কাছ থেকে?", options: ["আওরঙ্গজেব", "দ্বিতীয় শাহ আলম", "শাহ সুজা", "বাহাদুর শাহ জাফর"], correct: 1 },
      { question: "7. Regulating Act ব্রিটিশ ভারতের প্রশাসনে কোন সালে গুরুত্বপূর্ণ পরিবর্তন আনে?", options: ["১৭৫৭", "১৭৭৩", "১৭৮৪", "১৮১৩"], correct: 1 },
      { question: "8. Pitt's India Act প্রণীত হয়েছিল কোন সালে?", options: ["১৭৬৫", "১৭৭৩", "১৭৮৪", "১৭৯৩"], correct: 2 },
      { question: "9. ইয়ং বেঙ্গল আন্দোলনের প্রধান অনুপ্রেরণাদাতা কে ছিলেন?", options: ["হেনরি লুই ভিভিয়ান ডিরোজিও", "রাজা রামমোহন রায়", "দেবেন্দ্রনাথ ঠাকুর", "কেশবচন্দ্র সেন"], correct: 0 },
      { question: "10. বিধবা বিবাহ আইন, ১৮৫৬ প্রণয়নে কার ভূমিকা বিশেষভাবে উল্লেখযোগ্য?", options: ["বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "ঈশ্বরচন্দ্র বিদ্যাসাগর", "দীনবন্ধু মিত্র", "মাইকেল মধুসূদন দত্ত"], correct: 1 },
      { question: "11. ১৯৩৫ সালের ভারত শাসন আইনের একটি গুরুত্বপূর্ণ বৈশিষ্ট্য কী ছিল?", options: ["ভারতকে অবিলম্বে স্বাধীনতা প্রদান", "প্রাদেশিক স্বায়ত্তশাসনের ব্যবস্থা", "জাতিসংঘে ভারতের সদস্যপদ", "বঙ্গভঙ্গ কার্যকর করা"], correct: 1 },
      { question: "12. ১৯৪০ সালের লাহোর প্রস্তাব কোন রাজনৈতিক দলের অধিবেশনে গৃহীত হয়?", options: ["ভারতীয় জাতীয় কংগ্রেস", "অল ইন্ডিয়া মুসলিম লীগ", "কৃষক প্রজা পার্টি", "হিন্দু মহাসভা"], correct: 1 },
      { question: "13. ১৯৫৪ সালের পূর্ববাংলার প্রাদেশিক নির্বাচনে যুক্তফ্রন্টের নির্বাচনী প্রতীক কী ছিল?", options: ["নৌকা", "ধানের শীষ", "লাঙল", "কাস্তে"], correct: 0 },
      { question: "14. ১৯৬২ সালের শিক্ষা আন্দোলন তৎকালীন পাকিস্তানের কোন শিক্ষানীতির বিরুদ্ধে গড়ে ওঠে?", options: ["শরীফ শিক্ষা কমিশনের সুপারিশ", "হান্টার কমিশনের সুপারিশ", "সার্জেন্ট কমিশনের সুপারিশ", "উডের ডেসপ্যাচ"], correct: 0 },
      { question: "15. ২০২৬ সালের জুলাই থেকে ৪ অক্টোবর পর্যন্ত বাংলাদেশের প্রবাসী আয় আগের বছরের একই সময়ের তুলনায় কত শতাংশ বেড়েছিল?", options: ["৮.২%", "১২.৫%", "১৬.২%", "২২.৪%"], correct: 2 },
      { question: "16. ইউরোপীয় রেনেসাঁর সূচনা প্রধানত কোন দেশে হয়েছিল?", options: ["ফ্রান্স", "ইংল্যান্ড", "ইতালি", "জার্মানি"], correct: 2 },
      { question: "17. ফরাসি বিপ্লবের সূচনার প্রতীকী ঘটনা হিসেবে কোনটি পরিচিত?", options: ["ওয়াটারলুর যুদ্ধ", "বাস্তিল দুর্গের পতন", "ভার্সাই চুক্তি", "ভিয়েনা কংগ্রেস"], correct: 1 },
      { question: "18. ২০২৬ সালের অক্টোবরে স্বাক্ষরিত ৩০০ মিলিয়ন ডলারের বিশ্বব্যাংক অর্থায়ন প্রকল্পটির নাম কী?", options: ["Emergency Support for Food Security Project", "Digital Bangladesh 2.0", "National Space Research Project", "Coastal Tourism Expansion Project"], correct: 0 },
      { question: "19. ২০২৬ সালে হামের জরুরি টিকাদান কর্মসূচিতে প্রথম দফায় প্রায় কত শিশুকে টিকা দেওয়া হয়েছিল বলে প্রতিবেদনে উল্লেখ করা হয়?", options: ["৫ লাখ", "২০ লাখ", "২ কোটি", "৫ কোটি"], correct: 2 },
      { question: "20. আন্তর্জাতিক মাতৃভাষা দিবসের স্বীকৃতি UNESCO দেয় কোন সালে?", options: ["১৯৯৭", "১৯৯৮", "১৯৯৯", "২০০০"], correct: 2 },
      { question: "21. কিউবান ক্ষেপণাস্ত্র সংকট সংঘটিত হয়েছিল কোন সালে?", options: ["১৯৫৬", "১৯৬১", "১৯৬২", "১৯৬৮"], correct: 2 },
      { question: "22. ১৫১৭ সালে মার্টিন লুথারের ৯৫টি থিসিস কোন ঐতিহাসিক আন্দোলনের সঙ্গে যুক্ত?", options: ["শিল্পবিপ্লব", "ধর্মসংস্কার আন্দোলন", "আলোকায়ন আন্দোলন", "সমাজতান্ত্রিক আন্দোলন"], correct: 1 },
      { question: "23. ২০২৬ সালে বাংলাদেশে বড় আকারে ছড়িয়ে পড়া সংক্রামক রোগ কোনটি?", options: ["হাম", "পোলিও", "কলেরা", "জাপানি এনসেফালাইটিস"], correct: 0 },
      { question: "24. বার্লিন প্রাচীরের পতন ঘটে কোন সালে?", options: ["১৯৮৫", "১৯৮৭", "১৯৮৯", "১৯৯১"], correct: 2 },

    let userName = "";
    let currentQuestionIndex = 0;
    let totalScore = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let userWrongQuestions = []; 

    // Enter চাপলে কুইজ শুরু করার ফাংশন
    function handleEnter(event) {
      if (event.key === "Enter") {
        startQuiz();
      }
    }

    function startQuiz() {
      const nameInput = document.getElementById('user-name').value.trim();
      if(nameInput === "") {
        alert("Please enter your name!");
        return;
      }
      userName = nameInput;
      document.getElementById('display-name').innerText = `শিক্ষার্থী: ${userName}`;
      document.getElementById('user-info-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      const currentData = questionsDatabase[currentQuestionIndex];
      document.getElementById('next-btn').style.display = 'none';
      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';

      document.getElementById('progress-text').innerText = `প্রশ্ন ${currentQuestionIndex + 1}/${questionsDatabase.length}`;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / questionsDatabase.length) * 100}%`;
      document.getElementById('question-title').innerText = currentData.question;

      currentData.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.innerText = option;
        button.onclick = () => selectOption(index, button);
        optionsGrid.appendChild(button);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      const currentData = questionsDatabase[currentQuestionIndex];
      const allButtons = document.querySelectorAll('.option-btn');
      allButtons.forEach(btn => btn.disabled = true);

      if (selectedIndex === currentData.correct) {
        selectedBtn.classList.add('correct');
        totalScore += 1;
        correctCount++;
      } else {
        selectedBtn.classList.add('wrong');
        allButtons[currentData.correct].classList.add('correct');
        totalScore -= 0.25;
        wrongCount++;
        
        userWrongQuestions.push({
          question: currentData.question,
          selectedAnswer: currentData.options[selectedIndex],
          correctAnswer: currentData.options[currentData.correct]
        });
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    function handleNextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsDatabase.length) {
        loadQuestion();
      } else {
        submitResultsToDatabase();
      }
    }

    function submitResultsToDatabase() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      document.getElementById('final-score').innerText = totalScore.toFixed(2);
      document.getElementById('correct-count').innerText = correctCount;
      document.getElementById('wrong-count').innerText = wrongCount;

      db.collection("quiz_results 6").add({
        name: userName,
        score: totalScore.toFixed(2),
        correct: correctCount,
        wrong: wrongCount,
        wrongQuestions: userWrongQuestions,
        time: new Date()
      })
      .then(() => {
        console.log("ফলাফল সফলভাবে জমা হয়েছে!");
      })
      .catch((error) => {
        console.error("ডাটা সেভ করতে সমস্যা হয়েছে: ", error);
      });
    }
  </script>
